<!doctype html>
<html lang="ko">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PixelScope</title></head>
  <body>
    <main>
      <header class="app-header">
        <img class="app-logo" src="/icons/icon-48.png" width="42" height="42" alt="">
        <h1>PixelScope</h1>
      </header>
      <div class="ruler" aria-hidden="true"></div>
      <section id="capture-state" class="capture-state" aria-live="polite" hidden>
        <div><strong id="capture-state-label">캡처 페이지 계산 중</strong><output id="capture-state-count">준비 중</output></div>
        <span class="capture-track" aria-hidden="true"><span id="capture-state-bar"></span></span>
      </section>
      <section class="tools" aria-label="도구">
        <article class="tool-card" data-tool-card="measure" data-accordion>
          <div class="tool-row">
            <button class="tool-launch" data-tool="measure" type="button">
              <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7v10M20 7v10M4 12h16M8 9v6M12 9v6M16 9v6"/></svg></span>
              <b>영역 측정</b>
            </button>
            <button class="tool-more" type="button" aria-label="영역 측정 설정 열기" aria-expanded="false" aria-controls="measure-options">
              <svg aria-hidden="true" viewBox="0 0 20 20"><path d="m6 8 4 4 4-4"/></svg>
            </button>
          </div>
          <div class="settings-panel" id="measure-options" aria-hidden="true" inert><div class="panel-inner">
            <label class="setting-row" for="measurement-unit"><span>측정 단위</span><select id="measurement-unit"><option value="px">픽셀 (px)</option><option value="rem">루트 글꼴 (rem)</option><option value="viewport">화면 비율 (vw/vh)</option></select></label>
            <label class="setting-row checkbox-row" for="measurement-coordinates"><span>X/Y 좌표 표시</span><input id="measurement-coordinates" type="checkbox"></label>
            <label class="setting-row checkbox-row" for="measurement-box-model"><span>박스 모델 표시</span><input id="measurement-box-model" type="checkbox"></label>
          </div></div>
        </article>

        <article class="tool-card" data-tool-card="color-picker" data-accordion>
          <div class="tool-row">
            <button class="tool-launch" data-tool="color-picker" type="button">
              <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 19 3-6 7-7 3 3-7 7-6 3ZM14 5l2-2 5 5-2 2-5-5Z"/></svg></span>
              <b>컬러 피커</b>
            </button>
            <button class="tool-more" type="button" aria-label="컬러 피커 설정 열기" aria-expanded="false" aria-controls="color-options">
              <svg aria-hidden="true" viewBox="0 0 20 20"><path d="m6 8 4 4 4-4"/></svg>
            </button>
          </div>
          <div class="settings-panel" id="color-options" aria-hidden="true" inert><div class="panel-inner">
            <div class="setting-row scope-setting">
              <span id="color-picker-scope-label">피커 범위</span>
              <div class="scope-segmented" role="group" aria-labelledby="color-picker-scope-label">
                <label class="scope-option">
                  <input type="radio" name="color-picker-scope" value="screen">
                  <span>화면 전체</span>
                </label>
                <label class="scope-option">
                  <input type="radio" name="color-picker-scope" value="page">
                  <span>웹페이지만</span>
                </label>
              </div>
            </div>
            <label class="setting-row" for="copy-format"><span>복사 형식</span><select id="copy-format"><option value="hex">HEX</option><option value="rgb">RGB</option><option value="hsl">HSL</option></select></label>
          </div></div>
        </article>

        <article class="tool-card" data-tool-card="design-overlay" data-accordion>
          <div class="tool-row">
            <button class="tool-launch" id="design-overlay-launch" data-tool="design-overlay" type="button">
              <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 6.5h13v13H4z"/><path d="M7 4.5h13v13" stroke-dasharray="2.2 2.2"/></svg></span>
              <b>디자인 오버레이</b>
            </button>
            <button class="tool-more" type="button" aria-label="디자인 오버레이 설정 열기" aria-expanded="false" aria-controls="design-overlay-options">
              <svg aria-hidden="true" viewBox="0 0 20 20"><path d="m6 8 4 4 4-4"/></svg>
            </button>
          </div>
          <div class="settings-panel" id="design-overlay-options" aria-hidden="true" inert><div class="panel-inner">
            <label class="setting-row" for="design-overlay-file"><span>시안 이미지</span><input id="design-overlay-file" type="file" accept="image/*"></label>
            <label class="setting-row" for="design-overlay-scale"><span>이미지 배율</span><select id="design-overlay-scale"><option value="fit">화면 너비에 맞춤</option><option value="0.5">0.5x</option><option value="1">1x</option><option value="1.5">1.5x</option><option value="2">2x</option><option value="3">3x</option></select></label>
            <label class="setting-row" for="design-overlay-opacity"><span>투명도</span><input id="design-overlay-opacity" type="range" min="0" max="100" value="50"></label>
            <div class="setting-row scope-setting">
              <span id="design-overlay-blend-label">비교 방식</span>
              <div class="scope-segmented" role="group" aria-labelledby="design-overlay-blend-label">
                <label class="scope-option">
                  <input type="radio" name="design-overlay-blend" value="normal" checked>
                  <span>겹쳐보기</span>
                </label>
                <label class="scope-option">
                  <input type="radio" name="design-overlay-blend" value="difference">
                  <span>차이 비교</span>
                </label>
              </div>
            </div>
          </div></div>
        </article>

        <article class="tool-card" data-tool-card="css-changes">
          <div class="tool-row single">
            <button class="tool-launch" data-tool="css-changes" type="button">
              <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5 3.5 12 8 19M16 5l4.5 7-4.5 7M14 4l-4 16"/><path d="M6 9.5h4M14 14.5h4" stroke-dasharray="1.5 2"/></svg></span>
              <b>CSS 변경 추출</b>
            </button>
          </div>
        </article>

        <article class="tool-card" data-tool-card="unlock-interactions">
          <div class="tool-row single">
            <button class="tool-launch has-shortcut" id="unlock-interactions" type="button" aria-keyshortcuts="Alt+`" aria-pressed="false">
              <span class="icon" aria-hidden="true"><svg class="lock-icon" viewBox="0 0 24 24"><path class="lock-shackle" d="M7 11V8a5 5 0 0 1 10 0v3"/><path d="M5 11h14v10H5zM12 15v2.5"/></svg></span>
              <b>우클릭·드래그 해제</b>
              <kbd aria-hidden="true">Alt + `</kbd>
            </button>
          </div>
        </article>

        <article class="tool-card capture-card open" data-tool-card="capture">
          <div class="capture-head">
            <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 7h3l1.4-2h5.2L16 7h3a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
            <b>화면 캡처</b>
          </div>
          <div class="tool-panel"><div class="panel-inner">
            <div class="capture-actions">
              <button class="start" data-tool="capture-element" type="button">
                <svg aria-hidden="true" viewBox="0 0 20 20"><path d="M10 2.5v3M10 14.5v3M2.5 10h3M14.5 10h3" stroke-dasharray="0"/><rect x="5.5" y="5.5" width="9" height="9" rx="1" stroke-dasharray="2.2 2.2"/></svg>
                <b>영역 캡처</b>
              </button>
              <button class="start" data-tool="capture-page" type="button">
                <svg aria-hidden="true" viewBox="0 0 20 20"><path d="M5 2.5h10v15H5zM7.5 6h5M7.5 9h5M7.5 12h3"/></svg>
                <b>전체 페이지</b>
              </button>
            </div>
          </div></div>
        </article>

        <button id="stop" class="stop" type="button" hidden>
          <svg aria-hidden="true" viewBox="0 0 20 20"><path d="m6 6 8 8M14 6l-8 8"/></svg>
          <b id="stop-label">도구 종료</b>
        </button>

      </section>
      <p id="error" role="alert"></p>
      <div id="file-access-guide" class="file-access-guide" hidden>
        <p>혹시 로컬 파일(file://)을 열어둔 상태라면, 확장 프로그램의 파일 URL 접근 권한을 켜야 해요.</p>
        <button id="open-file-access-settings" type="button">확장 프로그램 설정 열기</button>
      </div>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
