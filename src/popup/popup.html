<!doctype html>
<html lang="ko">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PixelScope</title></head>
  <body>
    <main>
      <header><div><h1>PixelScope</h1><p>페이지 도구를 선택하세요</p></div><span id="status">대기</span></header>
      <section aria-label="도구">
        <button class="tool" data-tool="measure" type="button"><span class="icon" aria-hidden="true">↔</span><span><b>영역 측정</b><small>드래그한 영역의 픽셀 크기 측정</small></span></button>
        <button class="tool" data-tool="color-picker" type="button"><span class="icon" aria-hidden="true">◉</span><span><b>컬러 피커</b><small>화면 픽셀의 색상 추출 및 복사</small></span></button>
        <button id="stop" class="tool stop" type="button" hidden><span class="icon" aria-hidden="true">×</span><span><b>도구 종료</b><small>활성 도구와 오버레이 제거</small></span></button>
      </section>
      <fieldset>
        <legend>컬러 피커 설정</legend>
        <label>복사 형식 <select id="copy-format"><option value="hex">HEX</option><option value="rgb">RGB</option><option value="hsl">HSL</option></select></label>
        <label class="check"><input id="keep-active" type="checkbox" checked> 복사 후 계속 선택</label>
      </fieldset>
      <p id="error" role="alert"></p>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
